[project]
name = "bbc-most-read-rss"
version = "0.1.0"
description = "Generate RSS from BBC News' Most read top ten"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12,<5"]

[project.scripts]
bbc-most-read-rss = "bbc_rss:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["bbc_rss.py", "bbc_server.py"]
