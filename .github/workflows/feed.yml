name: Update and publish BBC RSS

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      initialize_history:
        description: 'Allow creating feed-data if it does not exist (first run only)'
        type: boolean
        default: false

permissions:
  contents: read

# One writer across both scheduled and manually triggered runs.
concurrency:
  group: bbc-rss-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install uv
          uv sync --frozen
      - name: Test
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Restore persistent history
        env:
          INITIALIZE: ${{ inputs.initialize_history || false }}
        run: |
          if [[ "$INITIALIZE" == true ]]; then
            bash scripts/pages-history.sh restore --initialize
          else
            bash scripts/pages-history.sh restore
          fi
      - name: Scrape and update feed
        env:
          FEED_URL: ${{ vars.FEED_URL || format('{0}/feed.xml', steps.pages.outputs.base_url) }}
        run: uv run --frozen bbc-most-read-rss --output .feed-history/feed.xml --feed-url "$FEED_URL"
      - name: Save persistent history
        run: bash scripts/pages-history.sh save
      - name: Prepare static output
        run: |
          mkdir -p public
          cp .feed-history/feed.xml public/feed.xml
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
